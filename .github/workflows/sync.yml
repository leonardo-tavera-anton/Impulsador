name: Sync to Hugging Face
on:
  push:
    branches: [main] # Se ejecutará cada vez que subas cambios a main

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push --force https://leonardotaveraanton:$HF_TOKEN@huggingface.co/spaces/leonardotaveraanton/sura-app main